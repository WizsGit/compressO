version: '3.8'

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    env_file:
      - .env
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_DOWNLOADS: "true"
      TELEGRAM_ENABLE_IPv6: "false"
      TELEGRAM_PROXY_TO_TDS: "true"
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    restart: always
    command: >-
      --local
      --api-id=${TELEGRAM_API_ID}
      --api-hash=${TELEGRAM_API_HASH}
      --dir=/var/lib/telegram-bot-api
      --db-root-ca-file=/etc/ssl/certs/ca-certificates.crt
      --log-level=INFO

  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-compress_db}
      # Set these for compatibility with older versions
      PGUSER: ${DB_USER:-user}
      PGPASSWORD: ${DB_PASSWORD:-password}
      PGDATABASE: ${DB_NAME:-compress_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  telegram-bot-api-data:
  postgres-data:
